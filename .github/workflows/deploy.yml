name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to zerocreds.ru
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ~/zerocreds-server
            git stash || true
            git pull origin main
            EXPECTED=$(git rev-parse HEAD | cut -c1-12)
            cd server && npm install --omit=dev
            sudo /usr/bin/systemctl restart zerocreds-server
            sleep 2
            LIVE=$(curl -s http://localhost:3456/version | python3 -c "import sys,json; print(json.load(sys.stdin)['commit'])")
            if [ "$LIVE" != "$EXPECTED" ]; then
              echo "❌ Hash mismatch: expected $EXPECTED, server reports $LIVE"
              exit 1
            fi
            echo "✓ Deployed and verified: $LIVE"
            echo "   https://github.com/Zerocreds-com/zerocreds-server/commit/$LIVE"
