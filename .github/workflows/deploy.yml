name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zerocreds.ru
            host_secret: DEPLOY_HOST_RU
            user_secret: DEPLOY_USER_RU
            key_secret: DEPLOY_KEY
            required: true
          - name: zerocreds.com
            host_secret: DEPLOY_HOST_COM
            user_secret: DEPLOY_USER_COM
            key_secret: DEPLOY_KEY_COM
            required: false
    steps:
      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets[matrix.user_secret] }}
          key: ${{ secrets[matrix.key_secret] }}
          script: |
            set -e
            cd ~/zerocreds-server
            git fetch origin main
            git reset --hard origin/main
            EXPECTED=$(git rev-parse HEAD | cut -c1-12)
            cd server && npm install --omit=dev
            sudo /usr/bin/systemctl restart zerocreds-server
            sleep 2
            LIVE=$(curl -s http://localhost:3456/version | python3 -c "import sys,json; print(json.load(sys.stdin)['commit'])")
            if [ "$LIVE" != "$EXPECTED" ]; then
              echo "❌ Hash mismatch: expected $EXPECTED, got $LIVE"
              exit 1
            fi
            echo "✓ ${{ matrix.name }} deployed: $LIVE"
