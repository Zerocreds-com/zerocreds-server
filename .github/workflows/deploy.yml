name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy shared RU backend for both domains
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST_RU }}
          username: ${{ secrets.DEPLOY_USER_RU }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd ~/zerocreds-server
            git fetch origin main
            git reset --hard origin/main
            EXPECTED=$(git rev-parse --short=12 HEAD)
            cd server
            npm ci --omit=dev
            sudo -n /usr/local/sbin/zerocreds-nginx-apply
            sudo -n /usr/bin/systemctl restart zerocreds-server
            for attempt in $(seq 1 15); do
              LIVE=$(curl -fsS --max-time 3 http://localhost:3456/version | python3 -c "import sys,json; print(json.load(sys.stdin)['commit'])") && [ "$LIVE" = "$EXPECTED" ] && break
              sleep 2
            done
            [ "$LIVE" = "$EXPECTED" ]
      - name: Verify both domains externally with valid TLS
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          export EXPECTED_COMMIT="${EXPECTED_COMMIT:0:12}"
          python3 scripts/check-public.py
      - name: Record nginx diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST_RU }}
          username: ${{ secrets.DEPLOY_USER_RU }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo -n /usr/sbin/nginx -t 2>&1 || true
            systemctl is-active nginx zerocreds-server || true
            sudo -n /usr/bin/journalctl -u nginx --no-pager -n 20 || true
