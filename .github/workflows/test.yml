name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (tag in the trailing comment).
# The required `test` job depends on Linux/Windows local API checks and one
# sequential Linux-to-Windows share transfer.
jobs:
  peer-share-platform:
    name: peer-share-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Peer share relay, crypto and local API integration
        run: node --test server/test/local-share.test.js server/test/local-share-routes.test.js

  peer-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/share-cross-platform.cjs prepare peer-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peer-fixture
          path: peer-fixture/fixture.json
          retention-days: 1

  peer-sender-linux:
    name: peer-linux-sender
    needs: peer-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: peer-fixture
          path: peer-fixture
      - run: node scripts/share-cross-platform.cjs send peer-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peer-envelope-linux
          path: peer-fixture/envelope.json
          retention-days: 1

  peer-receiver-windows:
    needs: peer-sender-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: peer-fixture
          path: peer-fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: peer-envelope-linux
          path: peer-fixture
      - run: node scripts/share-cross-platform.cjs receive peer-fixture

  test:
    needs: [peer-share-platform, peer-receiver-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
          rm -f gitleaks gitleaks.tgz

      - name: Install (lockfile enforced)
        run: |
          cd server && npm ci
          cd ../mcp && npm ci
          cd ../wallet-worker && npm ci --include=optional
          # npm can silently skip workerd's platform package when this lockfile
          # was generated on macOS. Install the pinned Linux binary explicitly.
          if [ ! -f node_modules/@cloudflare/workerd-linux-64/bin/workerd ]; then
            WORKERD_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/workerd'].version")
            npm install --no-save --no-package-lock --ignore-scripts "@cloudflare/workerd-linux-64@${WORKERD_VERSION}"
          fi
          test -f node_modules/@cloudflare/workerd-linux-64/bin/workerd

      - name: Audit production dependencies
        run: |
          cd server && npm audit --omit=dev --audit-level=moderate
          cd ../mcp && npm audit --omit=dev --audit-level=moderate
          cd ../wallet-worker && npm audit --omit=dev --audit-level=moderate

      - name: Lint (syntax check)
        run: |
          find server/src server/test mcp wallet-worker/src wallet-worker/test scripts -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          python3 -m py_compile scripts/check-public.py
          python3 -m py_compile scripts/check-share-relay.py
          python3 scripts/check-workflow-inline-python.py

      - name: Unit tests
        run: |
          node --test scripts/test/*.test.js
          cd server && node --test test/*.test.js
          cd ../wallet-worker && npm test
          cd ../mcp && node --test test/*.test.js
